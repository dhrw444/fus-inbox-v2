name: fus_inbox_v2
description: "查看公共号码池的最新短信。可选号，可按州与区号筛选。"
publish_to: "none"

# 版本号只用于本地调试；CI 出包时会覆盖它（见 .github/workflows）。
version: 0.1.0+1

environment:
  # **下界不能低于 3.13。**
  #
  # 主构造器语法（`class const Foo({required this.x})`）是随 3.13 一起
  # 可用的。约束下界写低了，语言版本判定就跟着低，那个语法会被判
  # `primary-constructors is disabled` —— CI 上直接编译不过。
  #
  # （我第一版写了 `^3.9.0`，以为是「放宽一点更兼容」，实际是把用到的
  #   语言特性关掉了。）
  sdk: ^3.13.0
  flutter: ">=3.47.5"

dependencies:
  flutter:
    sdk: flutter

  # WebView。整个抓取层的立足点 —— 站点要求页面上下文里签名，
  # 用 `dart:io` 直接打接口拿不到数据。
  flutter_inappwebview: ^6.2.0-beta.3

  # 测试里要数「原生视图被创建几次」，得注入安卓端实现。
  # 钉成跟主包同一代次，避免解析到版本漂移。
  flutter_inappwebview_android: ^1.2.0-beta.3

  # 存两样东西：上次用的 UA（重启读回，见 `core/user_agent.dart`）
  # 和上次选的出口。**都不含凭据** —— 出口的 id 不含密码，
  # 存的是清单里的那一条。
  shared_preferences: ^2.5.6

  # 说明：**只留真正用到的**。
  #
  # 旧项目那份 pubspec 里有 8 个依赖，其中 5 个（dynamic_color /
  # material_ui / material_3_expressive / material_color_utilities /
  # pub_semver）在本项目里一次都没 import —— `shared_preferences`
  # 是唯一留下的那个，因为身份持久化真的要用它。
  # 而「多一个依赖」不只是多一份体积 —— 它多一层版本约束、多一处
  # 「为什么会有这个包」的疑问。用到再加。

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 纯 Dart 逻辑测试用官方 test 包（`flutter_test` 只覆盖 widget 测试）。
  test: ^1.25.0

  # lint 规则集，`analysis_options.yaml` 里 include 的就是它。
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # 抓取脚本。注入到站点页面里，负责挂钩接口 + 扫 DOM。
    - assets/scanner.js
    # 内置代理清单（一行一个出口）。
    - assets/proxies/
    # 应用图标。
    - assets/icon/icon.png
