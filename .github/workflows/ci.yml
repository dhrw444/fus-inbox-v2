name: CI

# 只跑「不需要真机」的检查。
#
# 这里**不跑** `flutter build apk` —— 出包是另一条流水线的事，而
# 每次 push 都出包既慢又浪费。这一条只要保证：类型对、格式对、
# 纯逻辑测试过。
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 装依赖
        run: flutter pub get

      # 纯逻辑测试。**这一条最有价值** —— 断言覆盖的正是旧代码里
      # 那些「只能靠读代码看着对」的判断。
      - name: 纯逻辑测试
        run: dart run tool/rewrite_test.dart

      # 代理桥的端到端测试。起一个假 SOCKS5 上游，让桥去连它，
      # 验握手字节、认证、隧道、错误码 —— 这些在真机上只表现为
      # 「页面打不开」，没有别的线索，所以必须在本地锁住。
      - name: 代理桥测试
        run: dart run tool/bridge_test.dart

      # 目录抓取：起一个本地假站点真跑 HTTP。重点验「出口没起来必须失败
      # 而不是悄悄直连」—— 那条退化了就是静默泄漏真实 IP，界面上看不出来。
      - name: 目录抓取测试
        run: dart run tool/fetch_test.dart

      # 抓取脚本的语法。JS 出错不会让 Dart 编译失败，只会在真机上
      # 静默什么都不做 —— 所以必须单独查。
      - name: JS 语法
        run: node --check assets/scanner.js

      - name: 类型检查
        run: flutter analyze --fatal-infos

      - name: 格式
        run: dart format --output=none --set-exit-if-changed lib tool
