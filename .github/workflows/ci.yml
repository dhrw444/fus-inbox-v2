name: CI

# 只跑「不需要真机」的检查。
#
# 这里**不跑** `flutter build apk` —— 出包是另一条流水线的事，而
# 每次 push 都出包既慢又浪费。这一条只要保证：类型对、格式对、
# 纯逻辑测试过。
on:
  push:
    branches: [main]
  workflow_dispatch:
  # 让 release.yml 能 `uses: ./.github/workflows/ci.yml` 复用这一段。
  # **少了这一行，那条引用会在解析阶段就失败**，而且报错信息是
  # 「workflow is not reusable」，不会指向真正缺的东西。
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 装依赖
        run: flutter pub get

      # 全部测试走官方 `flutter test`。
      #
      # 之前是 5 个 `dart run tool/xxx_test.dart`，每个自带一套断言框架。
      # 问题在于那套框架**失败时不会让进程退出非 0** —— 192 条断言全挂，
      # CI 依然是绿的。而且它跑在残的 SDK 上，连语法错都不报。
      #
      # 现在断言用 `package:test` 的 `expect`，失败即非 0；测试文件在 `test/`，
      # `flutter test` 自动发现。
      - name: 测试
        run: flutter test

      # 抓取脚本的语法。JS 出错不会让 Dart 编译失败，只会在真机上
      # 静默什么都不做 —— 所以必须单独查。
      - name: JS 语法
        run: node --check assets/scanner.js

      # `--fatal-infos` 把 info 也当失败。这一条是唯一能看见 lint 的地方：
      # 沙箱里的 analyzer 曾经因为 sky_engine 是空壳而静默报「无问题」。
      - name: 类型检查
        run: flutter analyze --fatal-infos

      - name: 格式
        run: dart format --output=none --set-exit-if-changed lib test tool
