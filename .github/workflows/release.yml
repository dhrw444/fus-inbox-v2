name: Release

# 出包。只在 main 上推、或者手动触发时跑。
#
# **手动触发必填版本号**，push 触发时用 pubspec 里现有的版本 + run_number
# 作为构建号 —— 这样每次 push 出的包 versionCode 一定往上走，不会因为
# 版本号没改而被安卓拒绝覆盖安装。
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本号（semver，例如 1.0.0 或 0.1.0-rc.1）"
        required: true
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-release:
    name: 出签名 APK
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.release_version.outputs.prerelease }}
      version: ${{ steps.release_version.outputs.version }}
    env:
      # 手动触发必须给版本号；push 触发时从 pubspec 的 version 行取主版本部分。
      RELEASE_VERSION: ${{ inputs.version_name || '0.1.0' }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: 装 Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      # **不用 `--enforce-lockfile`。**
      #
      # 那个开关会因为「本地和 CI 的 SDK 版本不同」而假失败：被 SDK 钉死的
      # 包（例如 test_api）两边版本不一样，它就报「Would change N dependencies」。
      # 出包不该被这个卡住 —— 真正的依赖一致性由 pubspec.lock 提交进仓库
      # 本身保证。
      - name: 装依赖
        run: flutter pub get

      - name: 写入版本号
        id: release_version
        run: |
          dart run tool/set_release_version.dart "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"
          # 版本号写回 pubspec 之后从那儿读，保证 GITHUB_OUTPUT 里的是真值
          # 而不是用户输入的原样 —— 输入 `1.2.3` 和写进去的必须是同一个。
          v=$(sed -n 's/^version: //p' pubspec.yaml)
          echo "version=${v%%+*}" >> "$GITHUB_OUTPUT"

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 没有这个 secret 时不失败 —— 那样脚本会出 unsigned 包并明确说出来。
          # 但在这里就不写 keystore 了，免得 base64 -d 空输入造出一个坏文件。
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.keystore
          else
            echo "::warning::没有 KEYSTORE_BASE64，这个包是 unsigned 的"
          fi

      - name: 写入密钥库与 key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          # 四个 secret 缺一个就不签 —— 半套凭据只会让 gradle 报错，
          # 不如明确走 unsigned。
          missing=''
          [ -n "${KEYSTORE_BASE64:-}" ] || missing="$missing KEYSTORE_BASE64"
          [ -n "${KEYSTORE_PASSWORD:-}" ] || missing="$missing KEYSTORE_PASSWORD"
          [ -n "${KEY_PASSWORD:-}" ] || missing="$missing KEY_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing KEY_ALIAS"

          if [ -n "$missing" ]; then
            echo "::warning::缺少 secret:$missing —— 这个包是 unsigned 的，装不上"
            exit 0
          fi

          # **密钥库要真写到磁盘上。** storeFile 是相对 android/ 的路径，
          # 所以文件必须落在 android/ 下 —— 写别处 gradle 会说找不到。
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/my-release-key.keystore

          # 密码里可能有 = 或反斜杠，用 printf 拼会坏。改成逐行 echo，
          # 引号包住变量，shell 不做二次解析。
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=my-release-key.keystore"
          } > android/key.properties

          # 校验：字节数非零、能认出是密钥库（PKCS12 的魔数是 0x3082…）
          size=$(stat -c%s android/my-release-key.keystore)
          if [ "$size" -lt 1000 ]; then
            echo "::error::密钥库只有 $size 字节，base64 解码可能失败了"
            exit 1
          fi
          echo "密钥库写入成功：$size 字节"

          # key.properties 不该带引号或空白 —— gradle 读的是裸值。
          if grep -q '"' android/key.properties; then
            echo "::error::key.properties 里混进了引号"
            exit 1
          fi
          echo "key.properties 写入成功"

      - name: 构建
        run: bash tool/build_release_apks.sh "$RELEASE_VERSION" "$RELEASE_BUILD_NUMBER"

      - name: 检查产物
        run: |
          set -euo pipefail
          # 有签名时产物是 `app-arm64-v8a-release.apk`，没签名时 gradle 会加
          # `-unsigned` 后缀。**两种都认** —— 但要把是哪一种说清楚，不能
          # 让人以为拿到的是能装的包。
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          signed=1
          if [ ! -f "$apk" ]; then
            apk=build/app/outputs/flutter-apk/app-arm64-v8a-release-unsigned.apk
            signed=0
          fi
          if [ ! -f "$apk" ]; then
            echo "::error::两种产物都没生成"
            ls -la build/app/outputs/flutter-apk/ || true
            exit 1
          fi
          echo "产物 $(basename "$apk")：$(stat -c%s "$apk") 字节"
          if [ "$signed" = "0" ]; then
            echo "::warning::这是 **unsigned** 包，装不上。要能装的包需要配置 KEYSTORE_BASE64 等四个 secret。"
            echo "unsigned=1" >> "$GITHUB_OUTPUT"
          else
            echo "unsigned=0" >> "$GITHUB_OUTPUT"
          fi
          # 符号表也要有 —— 混淆之后没有它，线上崩溃栈没法看。
          if [ ! -d build/debug-info ]; then
            echo "::error::没生成符号表 build/debug-info"
            exit 1
          fi
          ls build/debug-info

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ github.run_id }}
          # 通配：有签名/没签名两个文件名都覆盖到，不用在 YAML 里做条件分支。
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release*.apk
          if-no-files-found: error
          retention-days: 30

      # 符号表单独存：它不该进 Release（体积大且敏感），但排查线上崩溃要用。
      - name: 上传符号表
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols-${{ github.run_id }}
          path: build/debug-info
          if-no-files-found: error
          retention-days: 90
